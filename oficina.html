<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valdren — Oficina 3D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#091217;color:#ddd4bd;font:14px Segoe UI,sans-serif}header{position:absolute;z-index:2;left:22px;top:18px;right:22px}h1{font:27px Georgia,serif;letter-spacing:.1em;margin:0 0 5px}small{color:#91a7a7}.controls{display:flex;flex-wrap:wrap;gap:15px;margin-top:18px;padding:15px;background:#101d23eb;border:1px solid #a88b4c55;border-radius:5px;width:max-content;max-width:100%}label{display:grid;gap:6px;font-size:12px;color:#bcb498}select,button{padding:9px;background:#203038;border:1px solid #6b735f;color:#ede5ce;border-radius:3px;font:14px Segoe UI}button{cursor:pointer}canvas{display:block;width:100vw;height:100vh}footer{position:absolute;bottom:18px;left:24px;color:#a8b3a7;font-size:12px}#stats{margin-top:10px}</style>
<header><h1>VALDREN · OFICINA 3D</h1><small>Malhas editadas no Blender · Arraste para girar · Roda para aproximar</small><div class="controls"><label>Modelo<select id="model"><option value="Errante">Errante — aventureiro sem classe</option><option value="Sentinela">Sentinela — paladino</option><option value="Vigia">Vigia — cavaleiro original editado</option><option value="Oraculo">Oráculo — mago original editado</option><option value="Carrasco_do_Veu">Carrasco do Véu — novo inimigo</option><option value="Santuario">Santuário — novo cenário</option></select></label><label>Animação<select id="clip"></select></label><label>Velocidade<select id="speed"><option value="1">1×</option><option value=".5">0,5×</option><option value=".25">0,25×</option><option value="1.5">1,5×</option></select></label><button id="pause">Pausar</button><button id="camera">Câmera top-down</button></div><small id="stats">Carregando modelo…</small></header><footer>17 ossos · 8 clipes por personagem · GLB com animações embutidas</footer>
<script src="vendor/three.min.js"></script><script src="vendor/GLTFLoader.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#0d191f');scene.fog=new THREE.Fog('#0d191f',12,30);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,70);let cameraTop=false,distance=7.4;function setCamera(){camera.position.set(3,distance*(cameraTop?1.7:.62),distance);camera.lookAt(0,1.6,0)}setCamera();const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xadc9e2,0x332d20,1.3));const key=new THREE.DirectionalLight(0xd8edff,2);key.position.set(3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0xffbd6b,1.5);rim.position.set(-3,4,-2);scene.add(rim);const floor=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.6,.12,64),new THREE.MeshStandardMaterial({color:0x26343a,metalness:.35,roughness:.55}));floor.position.y=-.065;scene.add(floor);const ring=new THREE.Mesh(new THREE.TorusGeometry(1.51,.012,8,90),new THREE.MeshBasicMaterial({color:0x9e8b59}));ring.rotation.x=Math.PI/2;scene.add(ring);let object,mixer,clips=[],paused=false,current,token=0;
const el=id=>document.getElementById(id);function play(){if(!mixer)return;mixer.stopAllAction();const c=clips.find(c=>c.name===el('clip').value);if(c){current=mixer.clipAction(c);current.play()}}
async function load(){const t=++token;el('stats').textContent='Carregando modelo…';const key=el('model').value;new THREE.GLTFLoader().load('modelos/'+key+'.glb',g=>{if(t!==token)return;if(object)scene.remove(object);object=g.scene;scene.add(object);object.rotation.y=-.2;clips=g.animations;mixer=new THREE.AnimationMixer(object);el('clip').textContent='';for(const c of clips){const o=document.createElement('option');o.value=o.textContent=c.name;el('clip').append(o)}if(!clips.length){const o=document.createElement('option');o.textContent='Modelo estático';el('clip').append(o)}let meshes=0,bones=0;object.traverse(o=>{if(o.isMesh)meshes++;if(o.isBone)bones++});el('stats').textContent=`${meshes} malhas · ${bones} ossos · ${clips.length} clipes · Blender 4.5 LTS`;play()},undefined,e=>{el('stats').textContent='Falha ao carregar. Abra esta oficina pelo servidor do jogo.';console.error(e)})}
el('model').onchange=load;el('clip').onchange=play;el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Reproduzir':'Pausar'};el('camera').onclick=()=>{cameraTop=!cameraTop;setCamera()};let drag=false,last=0;renderer.domElement.onpointerdown=e=>{drag=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(drag&&object){object.rotation.y+=(e.clientX-last)*.012;last=e.clientX}};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onwheel=e=>{distance=Math.max(3.5,Math.min(10,distance+e.deltaY*.005));setCamera()};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(.1,clock.getDelta());if(mixer&&!paused)mixer.update(dt*Number(el('speed').value));renderer.render(scene,camera)}load();frame();
</script></html>
